name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-messages:
    name: Commit messages (commitizen)
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python + uv + deps
        uses: ./.github/actions/setup-python-uv

      - name: Check commit messages (pull_request)
        if: ${{ github.event_name == 'pull_request' }}
        run: uv run --locked cz check --rev-range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      - name: Check commit messages (push)
        if: ${{ github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' }}
        run: |
          BEFORE_SHA="${{ github.event.before }}"
          HEAD_SHA="${{ github.sha }}"

          git fetch --no-tags origin "$BEFORE_SHA" || true

          if git rev-parse --verify --quiet "$BEFORE_SHA^{commit}" >/dev/null; then
            uv run --locked cz check --rev-range "$BEFORE_SHA..$HEAD_SHA"
          else
            uv run --locked cz check --use-default-range
          fi

  hygiene:
    name: Hygiene (pre-commit)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python + uv + deps
        uses: ./.github/actions/setup-python-uv

      - name: Run hygiene hooks
        run: >-
          uv run --locked prek run --all-files
          trailing-whitespace end-of-file-fixer check-yaml check-added-large-files cspell

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python + uv + deps
        uses: ./.github/actions/setup-python-uv

      - name: Ruff format (check)
        run: uv run --locked ruff format --check

      - name: Ruff lint
        run: uv run --locked ruff check --output-format=github

  typecheck:
    name: Type check (ty)
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python + uv + deps
        uses: ./.github/actions/setup-python-uv

      - name: Run type checks
        run: uv check --locked

  tests:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python + uv + deps
        uses: ./.github/actions/setup-python-uv

      - name: Test quality
        run: uv run --locked tq check

      - name: Run tests
        run: uv run --locked pytest -q

  package:
    name: Package distributions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python + uv + deps
        uses: ./.github/actions/setup-python-uv

      - name: Build distributions
        run: uv build --no-sources

      - name: Exercise packaged contract resources and writer
        run: |
          uv run --locked python -I - <<'PY'
          import sys
          import tarfile
          import tempfile
          import zipfile
          from pathlib import Path

          wheel, = Path("dist").glob("*.whl")
          sdist, = Path("dist").glob("*.tar.gz")
          sys.path.insert(0, str(wheel.resolve()))
          from jbt.artifacts.parquet import Compression, WriterSettings, write_table
          from jbt.contracts import catalog

          assert str(wheel.resolve()) in catalog.__file__
          with zipfile.ZipFile(wheel) as archive, tarfile.open(sdist) as source:
              for name in ("catalog.json", "catalog.schema.json", "checks.json"):
                  member, = (
                      item for item in source.getmembers()
                      if item.name.endswith(f"/src/jbt/contracts/resources/{name}")
                  )
                  stream = source.extractfile(member)
                  assert stream is not None
                  assert stream.read() == archive.read(f"jbt/contracts/resources/{name}")
          settings = WriterSettings(
              compression=Compression.ZSTD, row_group_size=100,
              dictionary=False, statistics=True,
          )
          with tempfile.TemporaryDirectory() as directory:
              for table in catalog.catalog():
                  path = Path(directory) / f"{table.name}.parquet"
                  write_table(path, table, [], settings)
                  assert path.read_bytes()[:4] == b"PAR1"
          PY

  integration-tests:
    name: Integration tests (pytest)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python + uv + deps
        uses: ./.github/actions/setup-python-uv

      - name: Run integration tests
        run: uv run --locked pytest -q -m integration

  security:
    name: Security checks
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python + uv + deps
        uses: ./.github/actions/setup-python-uv

      - name: Scan repository history for secrets
        run: uv run --locked prek run betterleaks-history --hook-stage manual

      - name: Bandit
        run: uv run --locked bandit --configfile pyproject.toml -r src

      - name: Audit locked dependencies
        run: uv audit --locked
