name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Setup Python + uv + deps
        uses: ./.github/actions/setup-python-uv
      - name: Verify immutable release policy
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ github.event.release.id }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_METADATA: ${{ runner.temp }}/jbt-release.json
        run: |
          gh api --method GET -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GH_REPO/releases/$RELEASE_ID" > "$RELEASE_METADATA"
          uv run --locked python - <<'PY'
          import json
          import os
          import pathlib
          import runpy
          import tomllib

          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]
          check = runpy.run_path(".github/scripts/check_release.py")["check_publication"]
          check(
              project["version"],
              os.environ["RELEASE_TAG"],
              json.loads(pathlib.Path(os.environ["RELEASE_METADATA"]).read_bytes()),
              release_id=int(os.environ["RELEASE_ID"]),
          )
          PY
      - name: Run quality gates
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
          uv check --locked --no-sync
          uv run --no-sync tq check
          uv run --no-sync pytest
      - name: Build distributions
        run: uv build --no-sources
      - name: Check the final distribution archives
        run: uv run --no-sync python .github/scripts/check_release.py --distributions dist
      - name: Exercise financial replay with the final wheel
        run: |
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          wheel="${wheels[0]}"
          test -f "$wheel"
          uv run --locked pytest -q -m e2e --release-wheel "$wheel"
      - name: Store distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish distributions
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/jbt
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          skip-existing: false
