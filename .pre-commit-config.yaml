default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: f6467e1f1ebecf5020560405c7b26e01786a43c8  # frozen: v10.4.0
    hooks:
      - id: cspell
        language_version: 22.18.0
        files: ".*\\.md$"

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 46787482b9fb2003c56e0f7592e312ef381829d9  # frozen: 0.13.6
    hooks:
      - id: uv-lock

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 25bcf95026b96e2dd3c0aec3090c3d6ef6ca2e6c  # frozen: v0.17.3
    hooks:
      - id: ruff-format
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
        require_serial: true

  - repo: https://github.com/betterleaks/betterleaks
    rev: 81aff7a638638aae3a659845d089043e1d8fe9ac  # frozen: v1.9.0
    hooks:
      - id: betterleaks
      - id: betterleaks
        alias: betterleaks-history
        name: Betterleaks History Scan
        args: [--pre-commit=false, --staged=false, .]
        stages: [manual]

  - repo: https://github.com/commitizen-tools/commitizen
    rev: f690817de25831a37094ca35af5ada05c909ff1c  # frozen: v4.19.3
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: 18b2b8bb1b9b90d2d21283756e89b07fc9c747bf  # frozen: v0.0.95
    hooks:
      - id: ty
        args: [--locked]

  - repo: https://github.com/PyCQA/bandit
    rev: 92ae8b82fb422a639f0ed8d99e96cea769594e08  # frozen: 1.9.4
    hooks:
      - id: bandit
        name: Bandit Security Linter
        args: ["--configfile", "pyproject.toml"]
        additional_dependencies:
          - bandit[toml]
