default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: f5c5d72342f35643988a9ffa0705c05bd3ff8383  # frozen: v10.3.0
    hooks:
      - id: cspell
        language_version: 22.18.0
        files: ".*\\.md$"

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 308b7fa26251088f0f2a9ad4a5b5d86e30ac5455  # frozen: 0.12.24
    hooks:
      - id: uv-lock

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: f12be1ebaa5351c1fc76472de98db2c3446c8253  # frozen: v0.16.10
    hooks:
      - id: ruff-format
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
        require_serial: true

  - repo: https://github.com/betterleaks/betterleaks
    rev: 81aff7a638638aae3a659845d089043e1d8fe9ac  # frozen: v1.9.0
    hooks:
      - id: betterleaks
      - id: betterleaks
        alias: betterleaks-history
        name: Betterleaks History Scan
        args: [--pre-commit=false, --staged=false, .]
        stages: [manual]

  - repo: https://github.com/commitizen-tools/commitizen
    rev: 57217c394fff5064bedd48421fe4b6f5f73aad47  # frozen: v4.19.2
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: 55b90b9b17c398bf664dd80a913668780e29a812  # frozen: v0.0.85
    hooks:
      - id: ty
        args: [--locked]

  - repo: https://github.com/PyCQA/bandit
    rev: 92ae8b82fb422a639f0ed8d99e96cea769594e08  # frozen: 1.9.4
    hooks:
      - id: bandit
        name: Bandit Security Linter
        args: ["--configfile", "pyproject.toml"]
        additional_dependencies:
          - bandit[toml]
