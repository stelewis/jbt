default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: f5c5d72342f35643988a9ffa0705c05bd3ff8383  # frozen: v10.3.0
    hooks:
      - id: cspell
        language_version: 22.18.0
        files: ".*\\.md$"

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 2aeb804518b4373dbf5adb8dddc5466d9a6e6b21  # frozen: 0.12.19
    hooks:
      - id: uv-lock

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: a56c0b927e6465d37cae3e97d35d4d18ab2b96cd  # frozen: v0.16.9
    hooks:
      - id: ruff-format
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
        require_serial: true

  - repo: https://github.com/betterleaks/betterleaks
    rev: 5eab48332cc48565864514e3bc6de89df091a7c4  # frozen: v1.8.1
    hooks:
      - id: betterleaks
      - id: betterleaks
        alias: betterleaks-history
        name: Betterleaks History Scan
        args: [--pre-commit=false, --staged=false, .]
        stages: [manual]

  - repo: https://github.com/commitizen-tools/commitizen
    rev: 3f5ccc87b27966d9ed21cf5ea8ec2fba38ca65ce  # frozen: v4.19.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: 6972e4c5a7e9f45f05a2f30b668f221f43b770c9  # frozen: v0.0.84
    hooks:
      - id: ty
        args: [--locked]

  - repo: https://github.com/PyCQA/bandit
    rev: 92ae8b82fb422a639f0ed8d99e96cea769594e08  # frozen: 1.9.4
    hooks:
      - id: bandit
        name: Bandit Security Linter
        args: ["--configfile", "pyproject.toml"]
        additional_dependencies:
          - bandit[toml]
